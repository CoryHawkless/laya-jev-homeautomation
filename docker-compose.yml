services:
  # Official laya-serve: Jev-compatible POST /v1/systemone inference endpoint.
  # No custom inference code — this is the upstream server from Convai Innovations.
  laya-serve:
    build: ./server
    image: home-router-laya:latest
    container_name: home-router-laya
    profiles: [cpu, default]
    ports:
      - "8010:8000"
    environment:
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: "english"        # only preload the checkpoint we use; router still picks others on demand
      LAYA_LOG_LEVEL: info
      OMP_NUM_THREADS: "4"
    volumes:
      - hf-cache:/home/laya/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"status\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: always

  # GPU mode. Requires the NVIDIA Container Toolkit on the host.
  #   docker compose --profile gpu up -d laya-serve
  laya-serve-gpu:
    build: ./server
    image: home-router-laya:latest
    container_name: home-router-laya-gpu
    profiles: [gpu]
    ports:
      - "8010:8000"
    environment:
      LAYA_DEVICE: cuda
      LAYA_PRELOAD: "1"
      LAYA_MODELS: "english"        # only preload the checkpoint we use; router still picks others on demand
      LAYA_LOG_LEVEL: info
      OMP_NUM_THREADS: "4"
    volumes:
      - hf-cache:/home/laya/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"status\": *\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: always

volumes:
  hf-cache: {}
